<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías Registradas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuente opcional -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        h1 {
            font-weight: 600;
        }

        .list-group-item {
            transition: background-color 0.2s;
        }

        .list-group-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">

        <!-- Encabezado -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
            <h1 class="text-primary">📂 Categorías Registradas</h1>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('categorias.agregar_categoria') }}" class="btn btn-success">
                    ➕ Nueva Categoría
                </a>
                <a href="{{ url_for('productos.lista_productos') }}" class="btn btn-outline-secondary">
                    ← Volver a Productos
                </a>
            </div>
        </div>

        <!-- Lista de categorías -->
        {% if categorias %}
            <ul class="list-group shadow-sm rounded">
                {% for cat in categorias %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="fw-semibold fs-5">{{ cat.nombre }}</span>
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('categorias.editar_categoria', id=cat.id) }}" class="btn btn-warning btn-sm">✏️ Editar</a>
                            <form action="{{ url_for('categorias.eliminar_categoria', id=cat.id) }}" method="POST" class="d-inline">
                                <button class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta categoría?')">🗑️ Eliminar</button>
                            </form>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-info text-center mt-4">
                No hay categorías registradas aún.
            </div>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
