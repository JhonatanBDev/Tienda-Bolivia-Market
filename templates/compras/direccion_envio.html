<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dirección de Envío</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
            <h1 class="text-center mb-4">
                {{ 'Editar' if direccion else 'Agregar' }} Dirección de Envío
            </h1>

            <form method="POST" action="{{ url_for('direccion_envio.guardar_direccion_envio') }}">
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion"
                        value="{{ direccion.direccion if direccion else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" name="ciudad"
                        value="{{ direccion.ciudad if direccion else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="departamento" class="form-label">Departamento</label>
                    <input type="text" class="form-control" id="departamento" name="departamento"
                        value="{{ direccion.departamento if direccion else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="pais" class="form-label">País</label>
                    <input type="text" class="form-control" id="pais" name="pais"
                        value="{{ direccion.pais if direccion else '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" class="form-control" id="telefono" name="telefono"
                        value="{{ direccion.telefono if direccion else '' }}" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('direccion_envio.ver_direccion_envio') }}" class="btn btn-link">Volver</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
