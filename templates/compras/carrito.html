<!-- templates/carrito.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Mi carrito</h1>

        {% if items %}
            <ul class="list-group">
                {% for item in items %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ item.producto.nombre }}</strong><br>
                            Cantidad: {{ item.cantidad }}<br>
                            Precio unitario: Bs {{ item.producto.precio }}
                        </div>
                        <div>
                            <!-- Botón para comprar solo este producto 
                            <form method="POST" action="{{ url_for('carrito.comprar_item', id=item.id) }}" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Comprar solo este</button>
                            </form>-->
                            <a href="{{ url_for('carrito.pago_individual', id=item.id) }}" class="btn btn-success btn-sm">Comprar solo este (PayPal)</a>

                            <form method="POST" action="{{ url_for('carrito.eliminar_del_carrito', id=item.id) }}" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                            </form>

                        </div>
                    </li>
                {% endfor %}
            </ul>
            <!-- Botón para realizar la compra -->
             <form method="POST" action="{{ url_for('carrito.comprar_carrito') }}" class="mt-3">
                <button type="submit" class="btn btn-success">🛒 Comprar todo</button>
            </form>
            <!-- Opción de pago con PayPal -->
            <form method="POST" action="{{ url_for('carrito.iniciar_pago') }}">
                 <button type="submit" class="btn btn-dark mt-3">💳 Pagar con PayPal</button>
            </form>


        {% else %}
            <p>No tienes productos en tu carrito.</p>
        {% endif %}

        <a href="{{ url_for('productos.lista_productos') }}" class="btn btn-secondary mt-4">← Seguir comprando</a>
    </div>
</body>
</html>
