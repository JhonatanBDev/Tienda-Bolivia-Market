<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Detalle de Compra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
            <h1 class="text-center mb-4">Agregar Detalle de Compra</h1>

            <form method="POST">
                <div class="mb-3">
                    <label for="compra_id" class="form-label">ID de Compra</label>
                    <input type="number" class="form-control" id="compra_id" name="compra_id" required>
                </div>

                <div class="mb-3">
                    <label for="producto_id" class="form-label">ID de Producto</label>
                    <input type="number" class="form-control" id="producto_id" name="producto_id" required>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" name="cantidad" required>
                </div>

                <div class="mb-3">
                    <label for="precio_unitario" class="form-label">Precio Unitario (Bs)</label>
                    <input type="number" class="form-control" id="precio_unitario" name="precio_unitario" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('detalle_compra.ver_detalle_compra', compra_id=compra_id) }}" class="btn btn-link">Volver al detalle</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
