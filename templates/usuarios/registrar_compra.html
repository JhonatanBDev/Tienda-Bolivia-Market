<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Compra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
            <h1 class="text-center mb-4">Registrar Compra</h1>

            <form method="POST">
                <div class="mb-3">
                    <label for="producto_id" class="form-label">ID de Producto</label>
                    <input type="number" class="form-control" id="producto_id" name="producto_id" required>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" name="cantidad" required>
                </div>

                <div class="mb-3">
                    <label for="pagado" class="form-label">¿Pagado?</label>
                    <select class="form-select" id="pagado" name="pagado" required>
                        <option value="1">Sí</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('compra.ver_compras') }}" class="btn btn-link">Volver a la lista</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
