<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
            <h1 class="text-center mb-4">Editar Usuario</h1>
            <form method="POST">
              <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input class="form-control" name="username" value="{{ usuario.username }}" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input class="form-control" name="email" value="{{ usuario.email }}" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" value="{{ usuario.password }}" required>
              </div>
              {% if current_user.is_authenticated and current_user.rol == 'admin' %}
                <div class="mb-3">
                  <label class="form-label">Rol</label>
                  <input class="form-control" name="rol" value="{{ usuario.rol }}" required>
                </div>
              {% endif %}
              <button class="btn btn-primary w-100">Guardar cambios</button>
            </form>
             <!-- EN CASO DE QUE NO SER ADMIN
            <div class="text-center mt-3">
                <a href="{{ url_for('usuarios.lista_usuarios') }}" class="btn btn-link">← Volver al listado</a>
            </div>
            -->
            <div class="text-center mt-3">
                <a href="{{ url_for('productos.lista_productos') }}" class="btn btn-link">← Volver al listado</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
