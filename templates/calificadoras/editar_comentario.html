<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Comentario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1>Editar Comentario</h1>

        <form method="POST">
            <div class="mb-3">
                <textarea name="contenido" class="form-control" required>{{ comentario.contenido }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{{ url_for('productos.detalle_producto', id=comentario.producto_id) }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
