<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Mis favoritos</h1>

        {% if favoritos %}
            <ul class="list-group">
                {% for item in favoritos %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>

                            <strong>Producto:</strong> {{ item.producto.nombre }}<br>
                            <strong>Agregado por:</strong> {{ item.usuario.username }}
                        </div>
                        <div>
                            <form method="POST" action="{{ url_for('favoritos.eliminar_favorito', id=item.id) }}" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                            </form>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No tienes productos en tu lista de favoritos.</p>
        {% endif %}

        <a href="{{ url_for('productos.lista_productos') }}" class="btn btn-secondary mt-4">← Volver a productos</a>
    </div>
</body>
</html>
