<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Categorias</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
            <h1 class="text-center mb-4">Agregar una nueva Categoria de Productos</h1>

            <form method="POST">
                <div class="mb-3">
                    <label for="categoria" class="form-label">Nombre de la Categoria</label>
                    <input type="text" class="form-control" id="categoria" name="nombre" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('categorias.lista_categoria') }}" class="btn btn-link">Volver a la lista</a>
            </div>
        </div>
    </div>

    

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
